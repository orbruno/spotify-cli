[project]
name = "spotify-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "spotipy>=2.25.1",
    "typer>=0.12.0",
]

[project.scripts]
spotify-cli = "spotify_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
